services:
  kafka:
    image: apache/kafka:3.7.0
    container_name: spacedrop-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk

  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: spacedrop-keycloak
    ports:
      - "8180:8080"
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres-keycloak:5432/spacedrop_keycloak
      KC_DB_USERNAME: spacedrop
      KC_DB_PASSWORD: spacedrop
    command: start-dev --import-realm
    volumes:
      - ./keycloak/spacedrop-realm.json:/opt/keycloak/data/import/spacedrop-realm.json
    depends_on:
      - postgres-keycloak

  postgres-keycloak:
    image: postgres:16-alpine
    container_name: spacedrop-postgres-keycloak
    ports:
      - "5435:5432"
    environment:
      POSTGRES_DB: spacedrop_keycloak
      POSTGRES_USER: spacedrop
      POSTGRES_PASSWORD: spacedrop
    volumes:
      - postgres-keycloak-data:/var/lib/postgresql/data

  postgres-users:
    image: postgres:16-alpine
    container_name: spacedrop-postgres-users
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: spacedrop_users
      POSTGRES_USER: spacedrop
      POSTGRES_PASSWORD: spacedrop
    volumes:
      - postgres-users-data:/var/lib/postgresql/data

  postgres-parking:
    image: postgres:16-alpine
    container_name: spacedrop-postgres-parking
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: spacedrop_parking
      POSTGRES_USER: spacedrop
      POSTGRES_PASSWORD: spacedrop
    volumes:
      - postgres-parking-data:/var/lib/postgresql/data

  postgres-booking:
    image: postgres:16-alpine
    container_name: spacedrop-postgres-booking
    ports:
      - "5434:5432"
    environment:
      POSTGRES_DB: spacedrop_booking
      POSTGRES_USER: spacedrop
      POSTGRES_PASSWORD: spacedrop
    volumes:
      - postgres-booking-data:/var/lib/postgresql/data

  postgres-payment:
    image: postgres:16-alpine
    container_name: spacedrop-postgres-payment
    ports:
      - "5436:5432"
    environment:
      POSTGRES_DB: spacedrop_payment
      POSTGRES_USER: spacedrop
      POSTGRES_PASSWORD: spacedrop
    volumes:
      - postgres-payment-data:/var/lib/postgresql/data

volumes:
  postgres-keycloak-data:
  postgres-users-data:
  postgres-parking-data:
  postgres-booking-data:
  postgres-payment-data:
