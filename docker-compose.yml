services:
  # --- Infrastructure ---

  kafka:
    image: apache/kafka:3.7.0
    container_name: spacedrop-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk

  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: spacedrop-keycloak
    ports:
      - "8180:8080"
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres-keycloak:5432/spacedrop_keycloak
      KC_DB_USERNAME: spacedrop
      KC_DB_PASSWORD: spacedrop
    command: start-dev --import-realm
    volumes:
      - ./keycloak/spacedrop-realm.json:/opt/keycloak/data/import/spacedrop-realm.json
    depends_on:
      - postgres-keycloak

  # --- Databases ---

  postgres-keycloak:
    image: postgres:16-alpine
    container_name: spacedrop-postgres-keycloak
    ports:
      - "5435:5432"
    environment:
      POSTGRES_DB: spacedrop_keycloak
      POSTGRES_USER: spacedrop
      POSTGRES_PASSWORD: spacedrop
    volumes:
      - postgres-keycloak-data:/var/lib/postgresql/data

  postgres-users:
    image: postgres:16-alpine
    container_name: spacedrop-postgres-users
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: spacedrop_users
      POSTGRES_USER: spacedrop
      POSTGRES_PASSWORD: spacedrop
    volumes:
      - postgres-users-data:/var/lib/postgresql/data

  postgres-parking:
    image: postgres:16-alpine
    container_name: spacedrop-postgres-parking
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: spacedrop_parking
      POSTGRES_USER: spacedrop
      POSTGRES_PASSWORD: spacedrop
    volumes:
      - postgres-parking-data:/var/lib/postgresql/data

  postgres-booking:
    image: postgres:16-alpine
    container_name: spacedrop-postgres-booking
    ports:
      - "5434:5432"
    environment:
      POSTGRES_DB: spacedrop_booking
      POSTGRES_USER: spacedrop
      POSTGRES_PASSWORD: spacedrop
    volumes:
      - postgres-booking-data:/var/lib/postgresql/data

  postgres-payment:
    image: postgres:16-alpine
    container_name: spacedrop-postgres-payment
    ports:
      - "5436:5432"
    environment:
      POSTGRES_DB: spacedrop_payment
      POSTGRES_USER: spacedrop
      POSTGRES_PASSWORD: spacedrop
    volumes:
      - postgres-payment-data:/var/lib/postgresql/data

  # --- Observability ---

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.96.0
    container_name: spacedrop-otel-collector
    ports:
      - "4317:4317"
      - "4318:4318"
      - "8889:8889"
    volumes:
      - ./observability/otel-collector/otel-collector-config.yml:/etc/otelcol-contrib/config.yaml
    depends_on:
      - tempo

  tempo:
    image: grafana/tempo:2.4.1
    container_name: spacedrop-tempo
    ports:
      - "3200:3200"
    command: ["-config.file=/etc/tempo.yml"]
    volumes:
      - ./observability/tempo/tempo.yml:/etc/tempo.yml
      - tempo-data:/var/tempo

  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: spacedrop-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus

  grafana:
    image: grafana/grafana:10.4.1
    container_name: spacedrop-grafana
    ports:
      - "3100:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
      - tempo

  # --- Backend Services ---

  discovery-service:
    build: ./backend/discovery-service
    container_name: spacedrop-discovery-service
    ports:
      - "8761:8761"
    environment:
      SPRING_PROFILES_ACTIVE: docker

  api-gateway:
    build: ./backend/api-gateway
    container_name: spacedrop-api-gateway
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      - discovery-service
      - keycloak

  user-service:
    build: ./backend/user-service
    container_name: spacedrop-user-service
    ports:
      - "8081:8081"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      - discovery-service
      - kafka
      - postgres-users
      - otel-collector

  parking-service:
    build: ./backend/parking-service
    container_name: spacedrop-parking-service
    ports:
      - "8082:8082"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      - discovery-service
      - kafka
      - postgres-parking
      - otel-collector

  booking-service:
    build: ./backend/booking-service
    container_name: spacedrop-booking-service
    ports:
      - "8083:8083"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      - discovery-service
      - kafka
      - postgres-booking
      - otel-collector

  notification-service:
    build: ./backend/notification-service
    container_name: spacedrop-notification-service
    ports:
      - "8084:8084"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      - discovery-service
      - kafka
      - otel-collector

  payment-service:
    build: ./backend/payment-service
    container_name: spacedrop-payment-service
    ports:
      - "8085:8085"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      - discovery-service
      - kafka
      - postgres-payment
      - otel-collector

  # --- Web UI ---

  web-ui:
    build: ./web-ui
    container_name: spacedrop-web-ui
    ports:
      - "3000:80"
    depends_on:
      - api-gateway

volumes:
  postgres-keycloak-data:
  postgres-users-data:
  postgres-parking-data:
  postgres-booking-data:
  postgres-payment-data:
  tempo-data:
  prometheus-data:
  grafana-data:
