eureka:
  client:
    service-url:
      defaultZone: http://discovery-service:8761/eureka/

spring:
  kafka:
    bootstrap-servers: kafka:9092

management:
  otlp:
    tracing:
      endpoint: http://otel-collector:4318/v1/traces
    metrics:
      export:
        endpoint: http://otel-collector:4318/v1/metrics
